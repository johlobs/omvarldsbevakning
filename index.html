  const bytes = b64 => Uint8Array.from(atob(b64), c => c.charCodeAt(0));

  async function decrypt(password) {
    const material = await crypto.subtle.importKey("raw", new TextEncoder().encode(password), "PBKDF2", false, ["deriveKey"]);
    const key = await crypto.subtle.deriveKey(
      { name: "PBKDF2", salt: bytes(SALT), iterations: ITER, hash: "SHA-256" },
      material, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
    const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: bytes(IV) }, key, bytes(DATA));
    return new TextDecoder().decode(plain);
  }

  document.getElementById("form").addEventListener("submit", async event => {
    event.preventDefault();
    const button = document.getElementById("go"), error = document.getElementById("err");
    button.disabled = true; error.textContent = "";
    try {
      const html = await decrypt(document.getElementById("pw").value);
      document.open(); document.write(html); document.close();
    } catch (e) {
      error.textContent = "Fel lösenord. Försök igen.";
      button.disabled = false;
    }
  });
